[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-far-research"
version = "0.1.0"
description = "Implementation of SOFT-FAR for LLM fine-tuning."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "geomloss>=0.2.5",
    "pot>=0.9.0",
    "sentence-transformers>=2.2.0",
    "accelerate>=0.21.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "evaluate>=0.4.0",
    "bert-score>=0.3.13"
]

[project.urls]
"Homepage" = "https://github.com/example/soft-far-research"
